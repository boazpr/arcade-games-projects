<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#0d0d24"/>
  <!-- Joystick base -->
  <ellipse cx="16" cy="22" rx="10" ry="5" fill="#1e1e4a"/>
  <!-- Joystick stick -->
  <rect x="14" y="10" width="4" height="13" rx="2" fill="#00f5ff"/>
  <!-- Joystick ball -->
  <circle cx="16" cy="9" r="5" fill="#00f5ff"/>
  <circle cx="14.5" cy="7.5" r="1.5" fill="#88ffff" opacity="0.7"/>
  <!-- Glow dot -->
  <circle cx="16" cy="9" r="5" fill="none" stroke="#00f5ff" stroke-width="1" opacity="0.4"/>
  <!-- Left button -->
  <circle cx="5" cy="20" r="3" fill="#ff00aa"/>
  <!-- Right button -->
  <circle cx="27" cy="20" r="3" fill="#ffe600"/>
</svg>
